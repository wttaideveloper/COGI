upstream public_website {
    server public-website:80;
}

upstream admin_portal {
    server admin-portal:80;
}

upstream strapi_backend {
    server strapi:1337;
}

upstream config_sync {
    server config-sync:3000;
}

# Rate limiting
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

# HTTPS variant of nginx.conf (same routes). Use via docker-compose.ssl.yml AFTER the certificate exists.
# Certificates live in /etc/letsencrypt (mounted read-only); renewals only need `nginx -s reload`.

server {
    listen 80;
    server_name cogi.wisdomtooth.tech;

    # Let's Encrypt HTTP-01 challenge (certbot --webroot); served before any redirect or proxy
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name cogi.wisdomtooth.tech;

    ssl_certificate /etc/letsencrypt/live/cogi.wisdomtooth.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cogi.wisdomtooth.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Start short; raise max-age once HTTPS is confirmed stable
    add_header Strict-Transport-Security "max-age=86400" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10M;

    # Public website (root)
    location / {
        proxy_pass http://public_website;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Site config (read by public site)
    location = /site-config.json {
        proxy_pass http://config_sync/site-config.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Admin portal (strip the /admin prefix for the container)
    location /admin/ {
        rewrite ^/admin(?<app>/.*)?$ $app break;
        proxy_pass http://admin_portal;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin portal root redirect
    location = /admin {
        return 301 /admin/;
    }

    # Site config write endpoint (admin portal)
    location /__site-config {
        proxy_pass http://config_sync;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Strapi API
    location /api {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://strapi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Strapi Admin root redirect
    location = /admin-strapi {
        return 301 /admin-strapi/;
    }

    # Strapi Admin API + plugin APIs (strip /admin-strapi so Strapi sees /admin/... etc.)
    location ~ ^/admin-strapi/(admin|content-manager|content-releases|review-workflows|upload)/ {
        rewrite ^/admin-strapi(/.*)$ $1 break;
        proxy_pass http://strapi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Strapi Admin panel + baked assets (served by Strapi under /admin-strapi)
    location /admin-strapi/ {
        proxy_pass http://strapi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Strapi Health Check
    location = /_health {
        proxy_pass http://strapi_backend/_health;
    }

    # Media uploads (Strapi static files)
    location /uploads {
        proxy_pass http://strapi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}