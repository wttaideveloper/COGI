services:
  # Strapi Backend
  strapi:
    build:
      context: ./strapi-backend
      dockerfile: Dockerfile
    container_name: cogi-strapi
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_CLIENT: postgres
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL: ${DATABASE_SSL:-true}
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      PUBLIC_URL: ${STRAPI_URL:-http://localhost:1337}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://localhost:5173,http://localhost:5174}
    volumes:
      - strapi_uploads:/opt/app/public/uploads
      - strapi_config:/opt/app/config
    ports:
      - "${STRAPI_PORT:-1337}:1337"
    networks:
      - cogi-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:1337/_health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Public Website
  public-website:
    build:
      context: ./public-website
      dockerfile: Dockerfile
      args:
        VITE_STRAPI_URL: ${VITE_STRAPI_URL:-http://localhost:1337}
        VITE_PUBLIC_SITE_URL: ${VITE_PUBLIC_SITE_URL:-http://localhost}
        VITE_GIVELIVELY_URL: ${VITE_GIVELIVELY_URL:-}
    container_name: cogi-public-website
    restart: unless-stopped
    networks:
      - cogi-network

  # Admin Portal
  admin-portal:
    build:
      context: ./admin-portal
      dockerfile: Dockerfile
      args:
        VITE_STRAPI_URL: ${VITE_STRAPI_URL:-http://localhost:1337}
        VITE_ADMIN_SITE_URL: ${VITE_ADMIN_SITE_URL:-http://localhost/admin}
        VITE_PUBLIC_SITE_URL: ${VITE_PUBLIC_SITE_URL:-http://localhost}
    container_name: cogi-admin-portal
    restart: unless-stopped
    networks:
      - cogi-network

  # Site Config Sync (persists admin config edits for the public site)
  config-sync:
    build:
      context: ./config-sync
      dockerfile: Dockerfile
    container_name: cogi-config-sync
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      SEED_FILE: /seed/site-config.json
    volumes:
      - site_config:/data
      - ./public-website/public/site-config.json:/seed/site-config.json:ro
    networks:
      - cogi-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: cogi-nginx
    restart: unless-stopped
    depends_on:
      - public-website
      - admin-portal
      - strapi
      - config-sync
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    networks:
      - cogi-network

volumes:
  strapi_uploads:
    driver: local
  strapi_config:
    driver: local
  site_config:
    driver: local
  nginx_logs:
    driver: local

networks:
  cogi-network:
    driver: bridge
